name: Coufunch
options:
  bundleIdPrefix: com.iosdevbyul
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  NetworkKit:
    url: https://github.com/iosdevbyul/TrisNetworkKit
    exactVersion: 0.1.0
  TrisAdKit:
    url: https://github.com/iosdevbyul/TrisAdKit
    revision: c5d43d3d7d19b3a649bdeb12040a7c80ae39141c
  TrisCalendarKit:
    url: https://github.com/iosdevbyul/TrisCalendarKit
    revision: 8aef88a41fea8c8e4dc4b8cde74a692488223942
  WakTrainerDesignSystem:
    url: https://github.com/iosdevbyul/WakTrainerDesignSystem
    revision: 5930de48224164723ece27491dc23893a6761a3a
targets:
  Coufunch:
    type: application
    platform: iOS
    sources:
      - path: Coufunch
    info:
      path: Coufunch/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        GADApplicationIdentifier: 'ca-app-pub-3940256099942544~1458002511'
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosdevbyul.Coufunch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_CFBundleDisplayName: Coufunch
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: NetworkKit
      - package: TrisCalendarKit
      - package: TrisAdKit
      - package: WakTrainerDesignSystem
    scheme:
      testTargets:
        - CoufunchTests
  CoufunchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoufunchTests
    dependencies:
      - target: Coufunch
