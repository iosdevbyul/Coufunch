name: Coufunch
options:
  bundleIdPrefix: com.iosdevbyul
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  NetworkKit:
    url: https://github.com/iosdevbyul/TrisNetworkKit
    exactVersion: 0.1.0
  TrisCalendarKit:
    url: https://github.com/iosdevbyul/TrisCalendarKit
    revision: 8aef88a41fea8c8e4dc4b8cde74a692488223942
  WakTrainerDesignSystem:
    url: https://github.com/iosdevbyul/WakTrainerDesignSystem
    branch: main
targets:
  Coufunch:
    type: application
    platform: iOS
    sources:
      - path: Coufunch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosdevbyul.Coufunch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_CFBundleDisplayName: Coufunch
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: NetworkKit
      - package: TrisCalendarKit
      - package: WakTrainerDesignSystem
    scheme:
      testTargets:
        - CoufunchTests
  CoufunchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoufunchTests
    dependencies:
      - target: Coufunch
