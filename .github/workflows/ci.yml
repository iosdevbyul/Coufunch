name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify full-screen launch storyboard configuration
        run: |
          test -f Coufunch/Info.plist
          test -f Coufunch/LaunchScreen.storyboard
          test "$(plutil -extract UILaunchStoryboardName raw -o - Coufunch/Info.plist)" = "LaunchScreen"
      - name: Verify generated AdMob application ID
        run: |
          test -f Coufunch/Info.plist
          test "$(plutil -extract GADApplicationIdentifier raw -o - Coufunch/Info.plist)" = "ca-app-pub-3940256099942544~1458002511"
      - name: Verify loopback-only ATS exception
        run: |
          test "$(plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw -o - Coufunch/Info.plist)" = "true"
          if plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw -o - Coufunch/Info.plist >/dev/null 2>&1; then
            echo "Arbitrary HTTP transport must stay disabled"
            exit 1
          fi
      - name: Verify iOS notification app icon asset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog = Path("Coufunch/Assets.xcassets/AppIcon.appiconset")
          data = json.loads((catalog / "Contents.json").read_text())
          icons = [
              item for item in data["images"]
              if item.get("idiom") == "universal" and item.get("platform") == "ios"
          ]
          assert len(icons) == 1, "Expected one universal iOS app icon"
          assert icons[0].get("size") == "1024x1024"
          assert icons[0].get("filename") == "1024.png"
          icon = catalog / icons[0]["filename"]
          assert icon.is_file(), "App icon source image missing"
          with icon.open("rb") as handle:
              header = handle.read(24)
          assert header[:8] == bytes((137, 80, 78, 71, 13, 10, 26, 10)), "Invalid PNG"
          assert int.from_bytes(header[16:20], "big") == 1024, "Wrong icon width"
          assert int.from_bytes(header[20:24], "big") == 1024, "Wrong icon height"
          print("iOS AppIcon 1024x1024 source validated")
          PY
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' project.yml
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Coufunch.xcodeproj -scheme Coufunch
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Coufunch.xcodeproj \
            -scheme Coufunch \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Select an available iPhone Simulator
        id: simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          phones = [device for devices in data["devices"].values() for device in devices
                    if device["name"].startswith("iPhone") and device.get("isAvailable", False)]
          if not phones:
              raise SystemExit("No available iPhone Simulator found")
          print("udid=" + phones[0]["udid"])
          PY
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Coufunch.xcodeproj \
            -scheme Coufunch \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
