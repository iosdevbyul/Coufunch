name: Merge PR after CI

on:
  workflow_run:
    workflows:
      - iOS CI
    types:
      - completed

# This privileged workflow never checks out or executes pull request code.
# Only the completed iOS CI result and GitHub API metadata are inspected.
permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge CI-passing trusted PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # GitHub can omit workflow_run.pull_requests even for a PR run.
          # Resolve the PR from the exact commit that CI tested.
          tested_head=$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")
          if [[ ! "$tested_head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Skipping: CI run has no valid tested commit SHA."
            exit 0
          fi

          gh api "repos/$REPO/commits/$tested_head/pulls" > "$RUNNER_TEMP/associated-prs.json"
          pr_count=$(jq '[.[] | select(.state == "open" and .base.ref == "main")] | length' "$RUNNER_TEMP/associated-prs.json")
          if [[ "$pr_count" != "1" ]]; then
            echo "Skipping: CI commit is not associated with exactly one open PR targeting main."
            exit 0
          fi
          pr=$(jq -r '[.[] | select(.state == "open" and .base.ref == "main")][0].number' "$RUNNER_TEMP/associated-prs.json")

          gh api "repos/$REPO/pulls/$pr" > "$RUNNER_TEMP/pr.json"
          if ! jq -e --arg repo "$REPO" '
            .state == "open" and
            .draft == false and
            .base.ref == "main" and
            .base.repo.full_name == $repo and
            .head.repo.full_name == $repo and
            .user.login == "iosdevbyul"
          ' "$RUNNER_TEMP/pr.json" >/dev/null; then
            echo "Skipping: PR is not an open, trusted, non-draft PR targeting main."
            exit 0
          fi

          actual_head=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")
          if [[ "$actual_head" != "$tested_head" ]]; then
            echo "Skipping: new commits arrived after the successful CI run."
            exit 0
          fi
          echo "PR #$pr: CI passed, trusted non-draft PR and unchanged tested head verified."
          # GitHub branch rules remain enforced. Never use --admin.
          # Reject merge if the PR head moved since this CI run.
          gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$tested_head"
